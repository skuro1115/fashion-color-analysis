[project]
name = "fashion-color-analysis"
version = "0.1.0"
description = "服画像の代表色抽出ツール (K-means k=10 / Lab)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "scikit-learn>=1.3",
    "scikit-image>=0.21",
    "pyyaml>=6.0",
]

[project.scripts]
fca = "fca.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
